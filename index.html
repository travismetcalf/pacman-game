<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>PAC-MAN</h1>

    <div class="hud">
        <div class="hud-item">
            <span class="hud-label">Score</span>
            <span id="score-value">0</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">Level</span>
            <span id="level-value">1/4</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">Lives</span>
            <span id="lives-value">&#10084; &#10084; &#10084;</span>
        </div>
    </div>

    <div class="game-container">
        <canvas id="game-canvas"></canvas>
    </div>

    <section class="leaderboard" aria-labelledby="leaderboard-title">
        <h2 id="leaderboard-title">Leaderboard</h2>
        <ol id="leaderboard-list"></ol>
    </section>

    <div id="highscore-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="highscore-title">
        <div class="modal-content">
            <h2 id="highscore-title">New High Score</h2>
            <p>Enter your initials (3 characters)</p>
            <form id="highscore-form">
                <input id="initials-input" type="text" inputmode="text" maxlength="3" minlength="3" autocomplete="off" required>
                <button id="save-score-btn" type="submit">Save Score</button>
            </form>
        </div>
    </div>

    <button id="mute-btn">&#128266; Sound On</button>

    <div class="footer">Arrow keys or WASD to move &bull; M to mute</div>

    <script type="module" src="main.js"></script>
</body>
</html>
